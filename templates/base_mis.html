{% load static %}
<!doctype html>
<html lang="{% if is_english %}en{% else %}ps{% endif %}" dir="{% if is_english %}ltr{% else %}rtl{% endif %}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f766e">
  <title>{% block title %}Education Center MIS{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
  <link rel="stylesheet" href="{% static 'css/dashboard-override.css' %}">
  <link rel="stylesheet" href="{% static 'css/sidebar-refined.css' %}">
  <link rel="stylesheet" href="{% static 'css/sidebar-access.css' %}">
  <link rel="stylesheet" href="{% static 'css/mis-dashboard.css' %}?v=3">
  <link rel="stylesheet" href="{% static 'css/mis-reports.css' %}?v=1">
</head>
<body class="mis-workspace {% if is_english %}mis-ltr{% else %}mis-rtl{% endif %}">
  {% block content %}{% endblock %}
</body>
</html>
