{% extends "base.html" %}
{% block title %}Login | Education Center{% endblock %}
{% block content %}<section style="min-height:70vh;display:grid;place-items:center;padding:35px"><form method="post" style="width:min(420px,100%);padding:32px;background:#fff;border:1px solid #dce7ed;border-radius:16px;box-shadow:0 10px 30px #0f172a12"><h1 style="color:#0f766e">Welcome back</h1><p>Sign in to access the Education Center system.</p>{% csrf_token %}{% if form.errors %}<p style="color:#be123c">Your email or password is incorrect.</p>{% endif %}<label>Email address</label><input name="{{ form.username.html_name }}" type="email" required style="width:100%;padding:11px;margin:7px 0 16px"><label>Password</label><input name="{{ form.password.html_name }}" type="password" required style="width:100%;padding:11px;margin:7px 0 20px"><button class="btn-primary-custom" style="width:100%;border:0">Sign in</button></form></section>{% endblock %}
